name: Build Android JNI

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'wallet/**'
      - 'bvm/**'
      - 'core/**'
      - 'keykeeper/**'
      - 'utility/**'
      - 'mnemonic/**'
      - 'node/**'
      - '3rdparty/asio-ipfs/**'

env:
  BUILD_TYPE: Release
  ANDROID_SDK_VERSION: 25

jobs:
  build_android:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
        include:
          - abi: arm64-v8a
            ndk_triple: aarch64-linux-android
            boost_tag: a64
            ctx_asm_arch: arm64
          - abi: armeabi-v7a
            ndk_triple: armv7a-linux-androideabi
            boost_tag: a32
            ctx_asm_arch: arm
          - abi: x86
            ndk_triple: i686-linux-android
            boost_tag: x32
            ctx_asm_arch: i386
          - abi: x86_64
            ndk_triple: x86_64-linux-android
            boost_tag: x64
            ctx_asm_arch: x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Submodule update
        run: git submodule update --init --recursive --jobs 4

      - name: Create Build Environment
        run: |
          # Unset credential helper to avoid 403 on public repo clones
          git config --global --unset-all http.https://github.com/.extraheader || true
          git clone --depth=1 https://github.com/BeamMW/boost-android.git ${{runner.workspace}}/dependencies/boost_1_68-android
          git clone --depth=1 https://github.com/BeamMW/openssl-android.git ${{runner.workspace}}/dependencies/Prebuilt-OpenSSL-Android
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "BOOST_ROOT_ANDROID=${{runner.workspace}}/dependencies/boost_1_68-android" >> $GITHUB_ENV
          echo "OPENSSL_ROOT_DIR_ANDROID=${{runner.workspace}}/dependencies/Prebuilt-OpenSSL-Android" >> $GITHUB_ENV

      - name: Build Boost.Context + Boost.Coroutine for Android
        run: |
          BOOST_ROOT="${{env.BOOST_ROOT_ANDROID}}"
          BOOST_INC="${BOOST_ROOT}/include"
          BOOST_LIB="${BOOST_ROOT}/libs/${{matrix.abi}}"
          NDK_BIN="${{env.ANDROID_NDK_HOME}}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="${NDK_BIN}/${{matrix.ndk_triple}}${{env.ANDROID_SDK_VERSION}}-clang"
          CXX="${NDK_BIN}/${{matrix.ndk_triple}}${{env.ANDROID_SDK_VERSION}}-clang++"
          AR="${NDK_BIN}/llvm-ar"
          SUFFIX="-clang-mt-${{matrix.boost_tag}}-1_68.a"
          TMPDIR=$(mktemp -d)

          # Download Boost 1.68 source (context + coroutine only)
          cd $TMPDIR
          git clone --depth=1 --branch=boost-1.68.0 https://github.com/boostorg/context.git
          git clone --depth=1 --branch=boost-1.68.0 https://github.com/boostorg/coroutine.git

          CTX_SRC="$TMPDIR/context/src"
          COR_SRC="$TMPDIR/coroutine/src"
          OBJDIR="$TMPDIR/obj"
          mkdir -p $OBJDIR

          CXX_FLAGS="-O2 -std=c++14 -fPIC -DANDROID -DNDEBUG \
            -DBOOST_CONTEXT_SOURCE -DBOOST_COROUTINES_SOURCE \
            -DBOOST_COROUTINES_NO_DEPRECATION_WARNING \
            -DBOOST_MPL_CFG_NO_NESTED_VALUE_ARITHMETIC \
            -Wno-deprecated-declarations \
            -I${BOOST_INC} \
            -I$TMPDIR/context/include \
            -I$TMPDIR/coroutine/include"

          # Determine assembly ABI suffix for context asm files
          if [ "${{matrix.ctx_asm_arch}}" = "arm64" ]; then
            ASM_ABI="aapcs"
          elif [ "${{matrix.ctx_asm_arch}}" = "arm" ]; then
            ASM_ABI="aapcs"
          elif [ "${{matrix.ctx_asm_arch}}" = "i386" ]; then
            ASM_ABI="sysv"
          elif [ "${{matrix.ctx_asm_arch}}" = "x86_64" ]; then
            ASM_ABI="sysv"
          fi

          ASM_PREFIX="${CTX_SRC}/asm"
          ASM_ARCH="${{matrix.ctx_asm_arch}}"

          # Build Boost.Context
          echo "=== Building Boost.Context for ${{matrix.abi}} ==="

          # Assemble context switching routines
          $CC -c $CXX_FLAGS \
            ${ASM_PREFIX}/jump_${ASM_ARCH}_${ASM_ABI}_elf_gas.S \
            -o $OBJDIR/jump.o
          $CC -c $CXX_FLAGS \
            ${ASM_PREFIX}/make_${ASM_ARCH}_${ASM_ABI}_elf_gas.S \
            -o $OBJDIR/make.o
          $CC -c $CXX_FLAGS \
            ${ASM_PREFIX}/ontop_${ASM_ARCH}_${ASM_ABI}_elf_gas.S \
            -o $OBJDIR/ontop.o

          # Only stack_traits needed — Boost.Coroutine uses fcontext
          # assembly directly, not the C++ execution_context class
          $CXX -c $CXX_FLAGS ${CTX_SRC}/posix/stack_traits.cpp -o $OBJDIR/ctx_stack_traits.o

          $AR rcs ${BOOST_LIB}/libboost_context${SUFFIX} \
            $OBJDIR/jump.o $OBJDIR/make.o $OBJDIR/ontop.o \
            $OBJDIR/ctx_stack_traits.o

          echo "Built: ${BOOST_LIB}/libboost_context${SUFFIX}"

          # Build Boost.Coroutine
          echo "=== Building Boost.Coroutine for ${{matrix.abi}} ==="

          $CXX -c $CXX_FLAGS ${COR_SRC}/exceptions.cpp -o $OBJDIR/cor_exceptions.o
          $CXX -c $CXX_FLAGS ${COR_SRC}/detail/coroutine_context.cpp -o $OBJDIR/coroutine_context.o
          $CXX -c $CXX_FLAGS ${COR_SRC}/posix/stack_traits.cpp -o $OBJDIR/cor_stack_traits.o

          $AR rcs ${BOOST_LIB}/libboost_coroutine${SUFFIX} \
            $OBJDIR/cor_exceptions.o $OBJDIR/coroutine_context.o \
            $OBJDIR/cor_stack_traits.o

          echo "Built: ${BOOST_LIB}/libboost_coroutine${SUFFIX}"
          ls -la ${BOOST_LIB}/libboost_co*

      - name: Configure CMake
        run: |
          export PATH=${{env.ANDROID_NDK_HOME}}:$PATH
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=${{env.ANDROID_NDK_HOME}}/build/cmake/android.toolchain.cmake \
            -DANDROID_NATIVE_API_LEVEL=${{env.ANDROID_SDK_VERSION}} \
            -DANDROID_ABI=${{matrix.abi}} \
            -DBEAM_IPFS_SUPPORT=On \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DCMAKE_CXX_FLAGS="-Wno-error=deprecated-literal-operator -Wno-deprecated-literal-operator -DBOOST_COROUTINES_NO_DEPRECATION_WARNING" \
            .

      - name: Build wallet-jni
        run: |
          export PATH=${{env.ANDROID_NDK_HOME}}:$PATH
          make wallet-jni -j$(nproc)

      - name: Save version info
        run: |
          echo "BEAM_VERSION=$(cat beam_version.gen)" >> $GITHUB_ENV
          rm beam_version.gen

      - uses: actions/upload-artifact@v4
        with:
          name: libwallet-jni-${{matrix.abi}}-${{env.BEAM_VERSION}}
          path: android/libwallet-jni.so
          if-no-files-found: error
          retention-days: 90
