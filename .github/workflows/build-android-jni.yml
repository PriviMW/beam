name: Build Android JNI

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'wallet/**'
      - 'bvm/**'
      - 'core/**'
      - 'keykeeper/**'
      - 'utility/**'
      - 'mnemonic/**'
      - 'node/**'
      - '3rdparty/asio-ipfs/**'

env:
  BUILD_TYPE: Release
  ANDROID_SDK_VERSION: 25

jobs:
  build_android:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        abi: [arm64-v8a]
        include:
          - abi: arm64-v8a
            ndk_triple: aarch64-linux-android21

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Submodule update
        run: git submodule update --init --recursive --jobs 4

      - name: Update Go module checksums
        run: |
          cd 3rdparty/asio-ipfs
          go mod tidy
          echo "go.sum updated with $(wc -l < go.sum) entries"

      - name: Create Build Environment
        run: |
          # Unset credential helper to avoid 403 on public repo clones
          git config --global --unset-all http.https://github.com/.extraheader || true
          git clone --depth=1 https://github.com/BeamMW/openssl-android.git ${{runner.workspace}}/dependencies/Prebuilt-OpenSSL-Android
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "OPENSSL_ROOT_DIR_ANDROID=${{runner.workspace}}/dependencies/Prebuilt-OpenSSL-Android" >> $GITHUB_ENV
          # Boost 1.90 is built from source below (mirrors upstream boost_build.yml build_android).
          # Output layout: $BOOST_ROOT_ANDROID/libs/${abi}/libboost_*.a + $BOOST_ROOT_ANDROID/include/boost/
          echo "BOOST_ROOT_ANDROID=${{runner.workspace}}/boost_prebuild" >> $GITHUB_ENV

      - name: Download Boost 1.90 source
        run: |
          wget -q https://archives.boost.io/release/1.90.0/source/boost_1_90_0.tar.gz
          tar -xvf boost_1_90_0.tar.gz > /dev/null
          mv ./boost_1_90_0 ${{runner.workspace}}/boost

      - name: Bootstrap Boost
        run: |
          cd ${{runner.workspace}}/boost
          ./bootstrap.sh

      - name: Write Boost user-config.jam
        run: |
          NDK=$ANDROID_NDK_LATEST_HOME
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          mkdir -p ${{runner.workspace}}/boost_prebuild/libs/${{matrix.abi}}
          cat > ${{runner.workspace}}/boost/user-config.jam <<EOF
          using clang : android : $TOOLCHAIN/bin/clang++ --target=${{matrix.ndk_triple}} --sysroot=$TOOLCHAIN/sysroot ;
          EOF

      - name: Build Boost 1.90 for Android
        run: |
          cd ${{runner.workspace}}/boost
          # Note: --with-locale omitted; Boost.Locale needs iconv/ICU which is not
          # available on Android, and the Android wallet-jni build does not link
          # Boost::locale (libbitcoin/atomic-swap is OFF for Android).
          ./b2 toolset=clang-android target-os=android link=static variant=release threading=multi --layout=system \
            --with-filesystem --with-program_options --with-thread --with-regex --with-log \
            --with-context --with-date_time --with-json --with-container --with-coroutine \
            --user-config=${{runner.workspace}}/boost/user-config.jam \
            cxxflags="-fPIC -DBOOST_ASIO_DISABLE_STD_ALIGNED_ALLOC" \
            cflags="-fPIC" \
            linkflags="-fPIC" \
            -j$(nproc)

      - name: Collect Boost prebuild
        run: |
          cp ${{runner.workspace}}/boost/stage/lib/*.a ${{runner.workspace}}/boost_prebuild/libs/${{matrix.abi}}/
          # Create include/ first so cp -R copies the boost headers INTO it as
          # include/boost/... (if include/ did not exist, cp would create it as
          # the boost dir contents, yielding include/intrusive/... and breaking
          # #include <boost/...> resolution).
          mkdir -p ${{runner.workspace}}/boost_prebuild/include
          cp -R ${{runner.workspace}}/boost/boost ${{runner.workspace}}/boost_prebuild/include
          echo "=== Built Boost libs ==="
          ls ${{runner.workspace}}/boost_prebuild/libs/${{matrix.abi}}/
          echo "=== Headers sample ==="
          ls ${{runner.workspace}}/boost_prebuild/include/boost/intrusive/ | head -3

      - name: Build Boost.Context fcontext assembly (Android arm64)
        run: |
          # b2 cannot select the fcontext asm for android arm64 (it deduces
          # <abi>sysv <architecture>arm instead of aapcs/arm64), so the b2-built
          # libboost_context.a ships fcontext.o (which references the symbols)
          # WITHOUT the jump/make/ontop_fcontext asm definitions -> undefined
          # symbols at link. Compile the asm manually and add to the archive.
          CTX_ASM="${{runner.workspace}}/boost/libs/context/src/asm"
          NDK_BIN="${{env.ANDROID_NDK_HOME}}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="${NDK_BIN}/${{matrix.ndk_triple}}-clang"
          AR="${NDK_BIN}/llvm-ar"
          NM="${NDK_BIN}/llvm-nm"
          BOOST_LIB="${{env.BOOST_ROOT_ANDROID}}/libs/${{matrix.abi}}"
          CFLAGS="-O2 -fPIC -DANDROID -DNDEBUG -I${{env.BOOST_ROOT_ANDROID}}/include"
          set -ex
          $CC -c $CFLAGS ${CTX_ASM}/jump_arm64_aapcs_elf_gas.S -o /tmp/jump.o
          $CC -c $CFLAGS ${CTX_ASM}/make_arm64_aapcs_elf_gas.S -o /tmp/make.o
          $CC -c $CFLAGS ${CTX_ASM}/ontop_arm64_aapcs_elf_gas.S -o /tmp/ontop.o
          $AR r ${BOOST_LIB}/libboost_context.a /tmp/jump.o /tmp/make.o /tmp/ontop.o
          echo "=== fcontext symbols now in libboost_context.a ==="
          $NM ${BOOST_LIB}/libboost_context.a | grep -iE "jump_fcontext|make_fcontext|ontop_fcontext" | head

      - name: Configure CMake
        run: |
          export PATH=${{env.ANDROID_NDK_HOME}}:$PATH
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=${{env.ANDROID_NDK_HOME}}/build/cmake/android.toolchain.cmake \
            -DANDROID_NATIVE_API_LEVEL=${{env.ANDROID_SDK_VERSION}} \
            -DANDROID_ABI=${{matrix.abi}} \
            -DBEAM_IPFS_SUPPORT=On \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DCMAKE_CXX_FLAGS="-Wno-error=deprecated-literal-operator -Wno-deprecated-literal-operator -DBOOST_COROUTINES_NO_DEPRECATION_WARNING -DBOOST_ASIO_DISABLE_STD_ALIGNED_ALLOC" \
            .

      - name: Build wallet-jni
        run: |
          export PATH=${{env.ANDROID_NDK_HOME}}:$PATH
          make wallet-jni -j$(nproc)

      - name: Collect artifacts
        run: |
          echo "BEAM_VERSION=$(cat beam_version.gen)" >> $GITHUB_ENV
          rm beam_version.gen
          # Copy Go IPFS shared library next to wallet-jni for packaging
          cp 3rdparty/asio-ipfs/ipfs_bindings/libipfs-bindings.so android/

      - name: Compute SHA-256
        run: |
          cd android
          sha256sum libwallet-jni.so libipfs-bindings.so | tee SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            android/libwallet-jni.so
            android/libipfs-bindings.so

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jni-${{ env.BEAM_VERSION }}-${{ github.sha }}
          name: Android JNI ${{ env.BEAM_VERSION }} (${{ matrix.abi }})
          files: |
            android/libwallet-jni.so
            android/libipfs-bindings.so
            android/SHA256SUMS
          generate_release_notes: true

      - uses: actions/upload-artifact@v4
        with:
          name: libwallet-jni-${{matrix.abi}}-${{env.BEAM_VERSION}}
          path: |
            android/libwallet-jni.so
            android/libipfs-bindings.so
            android/SHA256SUMS
          if-no-files-found: error
          retention-days: 90